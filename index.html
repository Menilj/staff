<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Staff Portal | CampusVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="apple-touch-icon.png">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        /* … (all previous CSS kept exactly the same) … */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #0f172a; --surface: #1e293b; --text: #f1f5f9; --text-secondary: #cbd5e1;
            --primary: #38bdf8; --accent: #0ea5e9; --success: #10b981; --warning: #f59e0b;
            --danger: #ef4444; --border: #334155; --shadow: 0 2px 4px rgba(0,0,0,0.2);
            --shadow-md: 0 6px 12px rgba(0,0,0,0.3); --radius: 10px; --radius-sm: 6px;
            --transition: 0.2s ease; --sidebar-width: 260px; --font: 'Inter', sans-serif;
        }
        body.light {
            --bg: #f1f5f9; --surface: #ffffff; --text: #0f172a; --text-secondary: #475569;
            --primary: #1e3a5f; --border: #e2e8f0; --shadow: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 6px 12px rgba(0,0,0,0.06);
        }
        body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; transition: background 0.3s, color 0.3s; }

        .login-overlay { position:fixed; inset:0; background:linear-gradient(135deg,#0b1e33,#1e3a5f); display:flex; align-items:center; justify-content:center; z-index:9999; }
        .login-card { background:var(--surface); border-radius:20px; padding:32px; width:90%; max-width:400px; text-align:center; box-shadow:0 25px 50px rgba(0,0,0,0.3); }
        .login-card h2 { font-weight:800; font-size:2rem; color:var(--primary); }
        .google-btn { width:100%; padding:14px; border-radius:30px; border:2px solid var(--border); background:var(--surface); font-weight:600; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; transition:var(--transition); margin-top:24px; color:var(--text); }
        .google-btn:hover { background:var(--bg); border-color:var(--primary); }
        .login-error { color:var(--danger); margin-top:12px; display:none; }

        .dashboard { display:none; min-height:100vh; }
        .dashboard.active { display:flex; }
        .sidebar { width:var(--sidebar-width); background:linear-gradient(180deg,#0b1e33,#1e293b); color:#fff; position:fixed; top:0; left:0; height:100vh; z-index:200; transition:transform 0.3s ease; box-shadow:4px 0 20px rgba(0,0,0,0.2); overflow-y:auto; }
        .sidebar .brand { padding:24px 20px; font-weight:800; font-size:1.4rem; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,0.1); }
        .sidebar .brand i { color:var(--accent); }
        .sidebar nav { padding:20px 12px; }
        .sidebar nav a { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:var(--radius); color:#cbd5e1; text-decoration:none; font-weight:500; transition:var(--transition); margin-bottom:4px; font-size:0.95rem; }
        .sidebar nav a:hover, .sidebar nav a.active { background:rgba(255,255,255,0.1); color:#fff; }
        .sidebar-footer { padding:20px; border-top:1px solid rgba(255,255,255,0.1); }
        .user-info { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
        .user-avatar { width:40px; height:40px; border-radius:50%; border:2px solid var(--accent); }
        .logout-btn { width:100%; background:rgba(255,255,255,0.1); border:none; color:#fff; padding:10px; border-radius:var(--radius-sm); cursor:pointer; font-weight:600; }
        .logout-btn:hover { background:rgba(255,255,255,0.2); }

        .main { flex:1; margin-left:var(--sidebar-width); padding:24px; transition:margin-left 0.3s ease; min-height:100vh; }
        .topbar-mobile { display:none; background:var(--surface); padding:12px 16px; border-bottom:1px solid var(--border); justify-content:space-between; align-items:center; position:sticky; top:0; z-index:50; box-shadow:var(--shadow); }
        .hamburger { background:none; border:none; font-size:1.5rem; color:var(--text); cursor:pointer; }
        .theme-toggle { background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:8px 14px; display:flex; align-items:center; gap:6px; cursor:pointer; transition:var(--transition); font-size:0.9rem; color:var(--text-secondary); font-weight:500; }
        .theme-toggle i { font-size:1rem; }
        .theme-toggle:hover { background:var(--border); }

        .card { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); overflow:hidden; margin-bottom:24px; }
        .card-header { padding:16px 20px; border-bottom:1px solid var(--border); font-weight:700; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
        .table-responsive { overflow-x:auto; -webkit-overflow-scrolling:touch; position:relative; max-height:60vh; overflow-y:auto; }
        table { width:100%; border-collapse:collapse; font-size:0.85rem; white-space:nowrap; }
        th { background:var(--bg); padding:12px 12px; text-align:left; font-weight:600; color:var(--text-secondary); border-bottom:2px solid var(--border); position:sticky; top:0; z-index:1; }
        td { padding:10px 12px; border-bottom:1px solid var(--border); }
        tr:hover td { background:var(--bg); }
        .badge { padding:4px 10px; border-radius:12px; font-size:0.7rem; font-weight:600; display:inline-block; }
        .badge-active { background:#d1fae5; color:#065f46; }
        .badge-pending { background:#fef3c7; color:#92400e; }
        .badge-assigned { background:#dbeafe; color:#1e40af; }
        .action-icon { background:none; border:none; font-size:1rem; cursor:pointer; padding:6px 8px; border-radius:6px; transition:0.2s; margin:0 2px; color:var(--text-secondary); }
        .action-icon:hover { background:var(--bg); color:var(--primary); }

        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); display:flex; align-items:flex-end; justify-content:center; z-index:1100; padding:0; }
        .modal-content { background:var(--surface); border-radius:20px 20px 0 0; width:100%; max-width:550px; max-height:85vh; overflow-y:auto; padding:1.5rem; border:1px solid var(--border); box-shadow:0 -10px 30px rgba(0,0,0,0.5); }
        @media (max-width:700px) {
            .modal { align-items:flex-end; }
            .modal-content { border-radius:20px 20px 0 0; max-width:100%; width:100%; margin:0; padding:1.5rem 1.25rem; }
            .modal-content h3 { font-size:1.2rem; }
            .form-group label { font-size:0.9rem; }
            .form-group input, .form-group select, .form-group textarea { font-size:16px !important; padding:12px; }
            .btn { font-size:0.9rem; padding:12px 16px; }
            .flex-between { flex-direction:column; gap:10px; }
            .flex-between .btn { width:100%; }
            .signature-canvas { height:120px; }
            .photo-grid { justify-content:center; }
            .photo-item { width:90px; }
            .photo-item img { width:90px; height:90px; }
        }
        .form-group { margin-bottom:1rem; }
        label { font-weight:500; font-size:0.8rem; display:block; margin-bottom:6px; }
        input, select, textarea { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:0.9rem; }
        .photo-grid { display:flex; flex-wrap:wrap; gap:12px; margin:16px 0; }
        .photo-item { background:var(--bg); border-radius:12px; overflow:hidden; text-align:center; border:1px solid var(--border); }
        .photo-item img { object-fit:cover; }
        .signature-canvas { border:2px solid var(--border); border-radius:12px; background:white; width:100%; height:140px; touch-action:none; margin:8px 0; }
        .flex-between { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:16px; }
        .btn { padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600; border:none; font-size:0.85rem; transition:0.2s; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
        .btn-primary { background:var(--primary); color:white; }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
        .toast { position:fixed; bottom:20px; right:20px; background:var(--surface); border-left:4px solid var(--success); padding:12px 20px; border-radius:8px; box-shadow:var(--shadow-md); z-index:1200; font-size:0.85rem; animation:slideIn 0.2s ease; }
        @keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }

        .desktop-table { display:block; } .mobile-cards { display:none; }
        .data-cards { display:flex; flex-direction:column; gap:12px; padding:16px; }
        .data-card { background:var(--surface); border-radius:var(--radius); padding:16px; border:1px solid var(--border); box-shadow:var(--shadow); }
        .data-card .card-row { display:flex; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; }
        .data-card .card-label { font-weight:600; color:var(--text-secondary); font-size:0.8rem; }
        .card-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
        @media (max-width:700px) {
            .sidebar { transform:translateX(-100%); }
            .sidebar.open { transform:translateX(0); }
            .main { margin-left:0; padding:16px; }
            .topbar-mobile { display:flex; }
            .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:150; }
            .sidebar-overlay.active { display:block; }
            .desktop-table { display:none; }
            .mobile-cards { display:block; }
        }

        /* ---- Camera Modern UI ---- */
        .camera-container { position:relative; width:100%; max-height:70vh; background:#000; border-radius:16px; overflow:hidden; }
        #liveVideo { width:100%; height:auto; display:block; }
        .camera-controls-top { position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:center; z-index:10; }
        .cam-btn { width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,0.5); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.3); color:#fff; font-size:1.1rem; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.2s; }
        .cam-btn:active { background:rgba(0,0,0,0.8); }
        .camera-controls-bottom { position:absolute; bottom:20px; left:12px; right:12px; display:flex; align-items:center; justify-content:space-around; z-index:10; }
        .capture-btn { width:70px; height:70px; border-radius:50%; background:white; border:4px solid rgba(255,255,255,0.8); cursor:pointer; transition:transform 0.1s; }
        .capture-btn:active { transform:scale(0.92); }
        .zoom-slider-container { display:flex; align-items:center; gap:8px; }
        .zoom-slider { width:100px; accent-color:var(--primary); }
        .focus-ring { position:absolute; width:60px; height:60px; border:2px solid yellow; border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; display:none; z-index:9; transition:opacity 0.3s; }
        .grid-overlay { position:absolute; inset:0; background-image:linear-gradient(to right, rgba(255,255,255,0.2) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.2) 1px, transparent 1px); background-size:33.33% 33.33%; pointer-events:none; display:none; z-index:5; }
        .countdown-overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.4); z-index:15; font-size:5rem; color:white; font-weight:bold; }
    </style>
</head>
<body>
<div class="login-overlay" id="loginScreen">
    <div class="login-card">
        <h2><i class="fas fa-user-tie"></i> Staff Portal</h2>
        <p>CampusVault • Operations</p>
        <button class="google-btn" id="staffGoogleBtn"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Sign in with Google</button>
        <p id="staffLoginError" class="login-error"></p>
    </div>
</div>

<div class="dashboard" id="staffDashboard">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="brand"><i class="fas fa-user-tie"></i> CampusVault</div>
        <nav>
            <a href="#" class="active" data-tab="bookings"><i class="fas fa-calendar-check"></i> Bookings</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <img class="user-avatar" id="userAvatar" src="" style="display:none;">
                <span id="userNameDisplay">Staff</span>
            </div>
            <button class="logout-btn" id="logoutStaffBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </aside>

    <main class="main">
        <div class="topbar-mobile">
            <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
            <div style="display:flex; gap:8px;">
                <button class="theme-toggle" id="themeToggleMobile"><i class="fas fa-sun"></i> Light</button>
            </div>
        </div>

        <div class="tab-content active" id="tab-bookings">
            <div class="card">
                <div class="card-header">
                    <span><i class="fas fa-boxes"></i> Active Bookings</span>
                    <span class="badge badge-assigned">Assigned to me: <span id="myAssignedCount">0</span></span>
                </div>
                <div class="desktop-table">
                    <div class="table-responsive">
                        <table id="bookingsTable">
                            <thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Items</th><th>Assigned</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody id="bookingsTableBody"><tr><td colspan="7">Loading bookings...</td></tr></tbody>
                        </table>
                    </div>
                </div>
                <div class="mobile-cards">
                    <div id="bookingsCardsContainer"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modals (edit, photos, camera, collection) -->
<div id="editModal" class="modal" style="display:none;" onclick="closeModalOnBg(event,'editModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3><i class="fas fa-pen-alt"></i> Request Edit (Admin Approval)</h3>
        <form id="editForm">
            <input type="hidden" id="editBookingKey">
            <div class="form-group"><label>Full Name</label><input id="editName" required></div>
            <div class="form-group"><label>Phone</label><input id="editPhone"></div>
            <div class="form-group"><label>Email</label><input id="editEmail" type="email"></div>
            <div class="form-group"><label>Check‑in Date</label><input id="editCheckIn" type="date"></div>
            <div class="form-group"><label>Collection Due</label><input id="editCollect" type="date"></div>
            <div class="form-group"><label>Item Count</label><input id="editItemCount" type="number"></div>
            <div class="form-group"><label>Category</label><select id="editCategory"><option>Electronics</option><option>Furniture</option><option>Clothing</option><option>Books</option><option>Other</option></select></div>
            <div class="flex-between"><button type="button" class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button><button type="submit" class="btn btn-primary">Submit Request</button></div>
        </form>
    </div>
</div>

<div id="photosModal" class="modal" style="display:none;" onclick="closeModalOnBg(event,'photosModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3><i class="fas fa-camera"></i> Verification Photos</h3>
        <div id="photosContainer" class="photo-grid"></div>
        <div class="flex-between">
            <button class="btn btn-outline" onclick="document.getElementById('fileUpload').click()"><i class="fas fa-upload"></i> Upload File</button>
            <button class="btn btn-outline" id="openRealtimeCameraBtn"><i class="fas fa-video"></i> Live Camera</button>
            <input type="file" id="fileUpload" accept="image/*" multiple style="display:none">
            <button class="btn btn-primary" onclick="closeModal('photosModal')">Close</button>
        </div>
    </div>
</div>

<!-- MODERN CAMERA MODAL -->
<div id="cameraModal" class="modal" style="display:none;" onclick="closeModalOnBg(event,'cameraModal')">
    <div class="modal-content" onclick="event.stopPropagation()" style="padding:0; max-width:600px;">
        <div class="camera-container">
            <video id="liveVideo" autoplay playsinline></video>
            <div class="grid-overlay" id="gridOverlay"></div>
            <div class="focus-ring" id="focusRing"></div>
            <div class="countdown-overlay" id="countdownOverlay"></div>

            <!-- Top controls -->
            <div class="camera-controls-top">
                <button class="cam-btn" id="flashBtn" title="Flash"><i class="fas fa-bolt"></i></button>
                <div style="display:flex; gap:8px;">
                    <button class="cam-btn" id="gridBtn" title="Grid"><i class="fas fa-border-all"></i></button>
                    <button class="cam-btn" id="timerBtn" title="Timer"><i class="fas fa-clock"></i></button>
                </div>
                <button class="cam-btn" id="switchCameraBtn" title="Switch Camera"><i class="fas fa-camera-rotate"></i></button>
            </div>

            <!-- Bottom controls -->
            <div class="camera-controls-bottom">
                <div class="zoom-slider-container">
                    <i class="fas fa-search-minus" style="color:white;"></i>
                    <input type="range" id="zoomSlider" class="zoom-slider" min="1" max="3" step="0.1" value="1" style="display:none;">
                    <i class="fas fa-search-plus" style="color:white;"></i>
                </div>
                <button class="capture-btn" id="capturePhotoBtn" title="Capture"></button>
                <button class="cam-btn" id="galleryPreviewBtn" style="background:transparent; border:none;" onclick="document.getElementById('fileUpload').click()">
                    <i class="fas fa-images"></i>
                </button>
            </div>
        </div>

        <!-- Photo review area (hidden by default) -->
        <div id="photoReview" style="display:none; padding:1rem; background:var(--surface);">
            <img id="reviewImage" style="width:100%; border-radius:12px;">
            <div class="flex-between" style="margin-top:12px;">
                <button class="btn btn-outline" id="retakePhotoBtnModern">Retake</button>
                <button class="btn btn-primary" id="confirmPhotoBtnModern">Use Photo</button>
            </div>
        </div>
    </div>
</div>

<div id="collectionModal" class="modal" style="display:none;" onclick="closeModalOnBg(event,'collectionModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3><i class="fas fa-signature"></i> Request Collection</h3>
        <div><label>Staff Signature (draw)</label><canvas id="staffCanvas" class="signature-canvas" width="500" height="140"></canvas><button type="button" class="btn-outline btn" onclick="clearCanvas('staffCanvas')">Clear</button></div>
        <div><label>Customer Signature (draw)</label><canvas id="customerCanvas" class="signature-canvas" width="500" height="140"></canvas><button type="button" class="btn-outline btn" onclick="clearCanvas('customerCanvas')">Clear</button></div>
        <div class="flex-between"><button class="btn btn-outline" onclick="closeModal('collectionModal')">Cancel</button><button class="btn btn-primary" id="submitCollectionReq">Submit Request</button></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCuCd89dawEHOGrKmcCimw3pBErKYJU_VI",
        authDomain: "campusvault-connect.firebaseapp.com",
        databaseURL: "https://campusvault-connect-default-rtdb.firebaseio.com",
        projectId: "campusvault-connect",
        storageBucket: "campusvault-connect.firebasestorage.app",
        messagingSenderId: "185904648786",
        appId: "1:185904648786:web:390764d552d388b6e2058b"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.database();
    const staffRef = db.ref('staff'), bookingsRef = db.ref('bookings');
    const pendingApprovalsRef = db.ref('pending_approvals');

    let currentStaffEmail = null, allBookings = [];
    let currentPhotoBookingKey = null;

    // Theme
    function setTheme(dark) {
        document.body.classList.toggle('light', !dark);
        localStorage.setItem('staffTheme', dark ? 'dark' : 'light');
        document.querySelectorAll('.theme-toggle i').forEach(i => i.className = dark ? 'fas fa-sun' : 'fas fa-moon');
        document.querySelectorAll('.theme-toggle span').forEach(s => s.textContent = dark ? 'Light' : 'Dark');
    }
    setTheme(localStorage.getItem('staffTheme') !== 'light');
    document.getElementById('themeToggleMobile').onclick = () => setTheme(document.body.classList.contains('light'));

    function showToast(msg, isError=false) {
        const t = document.createElement('div'); t.className='toast';
        t.innerHTML = `<i class="fas ${isError?'fa-exclamation-triangle':'fa-check-circle'}"></i> ${msg}`;
        document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
    }

    // Auth
    document.getElementById('staffGoogleBtn').onclick = () => {
        auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(async result => {
            const email = result.user.email, sanitized = email.replace(/\./g, ',');
            if((await staffRef.child(sanitized).once('value')).exists()) {
                currentStaffEmail = email;
                document.getElementById('loginScreen').style.display='none';
                document.getElementById('staffDashboard').classList.add('active');
                document.getElementById('userNameDisplay').textContent = result.user.displayName||email;
                if(result.user.photoURL) {
                    document.getElementById('userAvatar').src = result.user.photoURL;
                    document.getElementById('userAvatar').style.display='block';
                }
                loadBookingsRealtime();
            } else { auth.signOut(); document.getElementById('staffLoginError').textContent = '❌ Unauthorized staff email.'; document.getElementById('staffLoginError').style.display='block'; }
        }).catch(err => { document.getElementById('staffLoginError').textContent = err.message; document.getElementById('staffLoginError').style.display='block'; });
    };
    function logout() { auth.signOut().then(()=>location.reload()); }
    document.getElementById('logoutStaffBtn').onclick = logout;

    const sidebar=document.getElementById('sidebar'), overlay=document.getElementById('sidebarOverlay');
    document.getElementById('hamburgerBtn').onclick = ()=>{ sidebar.classList.add('open'); overlay.classList.add('active'); };
    window.closeSidebar = ()=>{ sidebar.classList.remove('open'); overlay.classList.remove('active'); };

    // Bookings rendering (unchanged)
    function renderBookingsTable(bookings) {
        const tbody = document.getElementById('bookingsTableBody');
        if(!bookings.length) { tbody.innerHTML='<tr><td colspan="7">No bookings.</td></tr>'; return; }
        let html='';
        for(let b of bookings){
            const isAssignedToMe = b.assigned_to === currentStaffEmail;
            const isUnassigned = !b.assigned_to;
            const canAccept = (isUnassigned && b.status==='active');
            const canManage = (isAssignedToMe && b.status==='active');
            const flags = (b.pending_edit?'🔶 Edit Pending ':'')+(b.pending_collection?'📄 Collect Pending':'');
            html+=`<tr>
                <td>${b.bookingId||b._key.slice(-6)}</td><td>${b.name||'—'}</td><td>${b.phone||'—'}</td>
                <td>${b.itemCount||'?'} (${b.category||'—'})</td>
                <td>${b.assigned_to?`👤 ${b.assigned_to.split('@')[0]}`:'<span class="badge badge-pending">Unassigned</span>'}</td>
                <td>${b.status} ${flags?`<br><small>${flags}</small>`:''}</td>
                <td>
                    ${canAccept?`<button class="action-icon" onclick="acceptBooking('${b._key}')" title="Accept"><i class="fas fa-check-circle" style="color:var(--success)"></i> Accept</button>`:''}
                    ${canManage?`<button class="action-icon" onclick="openEditModal('${b._key}')" title="Edit"><i class="fas fa-edit"></i> Edit</button>`:''}
                    ${canManage?`<button class="action-icon" onclick="openPhotosModal('${b._key}')" title="Photos"><i class="fas fa-image"></i> Photos</button>`:''}
                    ${canManage?`<button class="action-icon" onclick="openCollectionModal('${b._key}')" title="Collection"><i class="fas fa-truck"></i> Collect</button>`:''}
                    <button class="action-icon" onclick="sendWhatsAppStaff('${b.phone}','${b.name}','${b.bookingId||b._key}','${b.trackingId||b.bookingId||b._key}')" title="WhatsApp"><i class="fab fa-whatsapp" style="color:#25D366"></i> Chat</button>
                </td>
            </tr>`;
        }
        tbody.innerHTML=html;
    }
    function renderBookingsCards(bookings) {
        const container=document.getElementById('bookingsCardsContainer');
        if(!container) return;
        if(!bookings.length){ container.innerHTML='<p style="padding:16px;">No bookings.</p>'; return; }
        let html='';
        for(let b of bookings){
            const isAssignedToMe = b.assigned_to === currentStaffEmail;
            const isUnassigned = !b.assigned_to;
            const canAccept = (isUnassigned && b.status==='active');
            const canManage = (isAssignedToMe && b.status==='active');
            const flags = (b.pending_edit?'🔶 Edit Pending ':'')+(b.pending_collection?'📄 Collect Pending':'');
            html+=`<div class="data-card">
                <div class="card-row"><span class="card-label">ID</span><span>${b.bookingId||b._key.slice(-6)}</span></div>
                <div class="card-row"><span class="card-label">Customer</span><span>${b.name||'—'}</span></div>
                <div class="card-row"><span class="card-label">Phone</span><span>${b.phone||'—'}</span></div>
                <div class="card-row"><span class="card-label">Items</span><span>${b.itemCount||'?'} (${b.category||'—'})</span></div>
                <div class="card-row"><span class="card-label">Assigned</span><span>${b.assigned_to?`👤 ${b.assigned_to.split('@')[0]}`:'<span class="badge badge-pending">Unassigned</span>'}</span></div>
                <div class="card-row"><span class="card-label">Status</span><span>${b.status} ${flags?`<small>${flags}</small>`:''}</span></div>
                <div class="card-actions">
                    ${canAccept?`<button class="action-icon" onclick="acceptBooking('${b._key}')"><i class="fas fa-check-circle" style="color:var(--success)"></i> Accept</button>`:''}
                    ${canManage?`<button class="action-icon" onclick="openEditModal('${b._key}')"><i class="fas fa-edit"></i> Edit</button>`:''}
                    ${canManage?`<button class="action-icon" onclick="openPhotosModal('${b._key}')"><i class="fas fa-image"></i> Photos</button>`:''}
                    ${canManage?`<button class="action-icon" onclick="openCollectionModal('${b._key}')"><i class="fas fa-truck"></i> Collect</button>`:''}
                    <button class="action-icon" onclick="sendWhatsAppStaff('${b.phone}','${b.name}','${b.bookingId||b._key}','${b.trackingId||b.bookingId||b._key}')"><i class="fab fa-whatsapp" style="color:#25D366"></i> Chat</button>
                </div>
            </div>`;
        }
        container.innerHTML=html;
    }
    function updateAssignedCount(bookings) {
        document.getElementById('myAssignedCount').innerText = bookings.filter(b=>b.assigned_to===currentStaffEmail && b.status==='active').length;
    }
    function refreshBookingsUI(bookings) { renderBookingsTable(bookings); renderBookingsCards(bookings); updateAssignedCount(bookings); }

    window.acceptBooking = async (key) => {
        const booking = allBookings.find(b=>b._key===key);
        if(!booking || booking.assigned_to){ showToast('Already assigned',true); return; }
        await bookingsRef.child(key).update({ assigned_to:currentStaffEmail, assigned_at:new Date().toISOString() });
        showToast('Booking assigned to you');
    };

    window.sendWhatsAppStaff = (phone, name, bookingId, trackingId) => {
        if(!phone){ showToast('No phone number',true); return; }
        let cleaned = phone.replace(/\D/g,'');
        if(cleaned.startsWith('0')) cleaned='254'+cleaned.substring(1);
        const message = `CAMPUS VAULT BOOKING CONFIRMATION\n\nHello ${name},\n\nYour luggage storage reservation has been successfully received.\n\n📌 Booking ID: ${bookingId}\n🔍 Tracking ID: ${trackingId}\n\nPlease keep these details safely as they will be required when collecting your items.\n\n✅ Booking is FREE ✅ Payment is made upon collection ✅ Items are labelled, documented, and securely stored ✅ A signed storage agreement will be completed during handover\n\nIf you require pickup assistance, kindly contact us before your preferred pickup time.\n\n📲 WhatsApp: 0116375166\n\nThank you for choosing Campus Vault. Your Belongings. Our Responsibility. 🔒 :::`;
        window.open(`https://wa.me/${cleaned}?text=${encodeURIComponent(message)}`, '_blank');
    };

    // Edit request (unchanged)
    window.openEditModal = (key) => { /* ... same as before ... */ };
    document.getElementById('editForm').onsubmit = async (e) => { /* ... same as before ... */ };

    // Photos modal (unchanged except for fileUpload now used by modern camera preview)
    window.openPhotosModal = async (bookingKey) => { currentPhotoBookingKey = bookingKey; await loadPhotosForBooking(bookingKey); document.getElementById('photosModal').style.display = 'flex'; };
    async function loadPhotosForBooking(bookingKey) { /* ... same as before ... */ }
    window.deletePhoto = async (bookingKey, idx) => { /* ... same as before ... */ };
    document.getElementById('fileUpload').onchange = async (e) => { /* ... same upload logic, but also used by camera gallery button */ };

    // ---- ENHANCED CAMERA SYSTEM ----
    let currentStream = null;
    let currentFacingMode = 'environment'; // 'user' for front
    let flashOn = false;
    let gridOn = false;
    let timerOn = false;
    let currentZoom = 1;
    let capabilities = { torch: false, zoom: false };

    const video = document.getElementById('liveVideo');
    const focusRing = document.getElementById('focusRing');
    const gridOverlay = document.getElementById('gridOverlay');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const photoReview = document.getElementById('photoReview');
    const reviewImage = document.getElementById('reviewImage');

    document.getElementById('openRealtimeCameraBtn').onclick = async () => {
        await startModernCamera();
        document.getElementById('cameraModal').style.display = 'flex';
        document.getElementById('photoReview').style.display = 'none';
        video.style.display = 'block';
    };

    async function startModernCamera() {
        stopCamera();
        try {
            const constraints = {
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    zoom: currentZoom // will be overridden by applyConstraints later
                },
                audio: false
            };
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
            video.onloadedmetadata = () => {
                video.play();
                updateCapabilities();
                applyZoom(currentZoom);
            };
        } catch (err) {
            showToast('Camera access denied. Please grant permission.', true);
        }
    }

    async function updateCapabilities() {
        if (!currentStream) return;
        const videoTrack = currentStream.getVideoTracks()[0];
        if (!videoTrack) return;
        const trackCapabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : null;
        if (trackCapabilities) {
            capabilities.torch = 'torch' in trackCapabilities;
            capabilities.zoom = trackCapabilities.zoom ? true : false;
            if (capabilities.zoom) {
                document.getElementById('zoomSlider').style.display = 'inline-block';
                document.getElementById('zoomSlider').max = trackCapabilities.zoom.max || 3;
                document.getElementById('zoomSlider').min = trackCapabilities.zoom.min || 1;
            }
        }
        // Torch: check if track supports torch
        try {
            await videoTrack.applyConstraints({ advanced: [{ torch: flashOn }] });
            document.getElementById('flashBtn').style.display = 'inline-flex';
        } catch (e) {
            document.getElementById('flashBtn').style.display = 'none';
        }
    }

    function stopCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
        video.srcObject = null;
    }

    // Flash toggle
    document.getElementById('flashBtn').addEventListener('click', async () => {
        if (!currentStream) return;
        const videoTrack = currentStream.getVideoTracks()[0];
        if (!videoTrack) return;
        flashOn = !flashOn;
        try {
            await videoTrack.applyConstraints({ advanced: [{ torch: flashOn }] });
            document.getElementById('flashBtn').querySelector('i').className = flashOn ? 'fas fa-bolt' : 'fas fa-bolt-lightning';
        } catch (e) {
            showToast('Torch not supported', true);
        }
    });

    // Grid toggle
    document.getElementById('gridBtn').addEventListener('click', () => {
        gridOn = !gridOn;
        gridOverlay.style.display = gridOn ? 'block' : 'none';
    });

    // Timer toggle
    document.getElementById('timerBtn').addEventListener('click', () => {
        timerOn = !timerOn;
        document.getElementById('timerBtn').style.opacity = timerOn ? '0.6' : '1';
    });

    // Switch camera
    document.getElementById('switchCameraBtn').addEventListener('click', async () => {
        currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
        await startModernCamera();
    });

    // Zoom slider
    document.getElementById('zoomSlider').addEventListener('input', (e) => {
        currentZoom = parseFloat(e.target.value);
        applyZoom(currentZoom);
    });

    async function applyZoom(zoomValue) {
        if (!currentStream) return;
        const videoTrack = currentStream.getVideoTracks()[0];
        if (videoTrack && capabilities.zoom) {
            try {
                await videoTrack.applyConstraints({ advanced: [{ zoom: zoomValue }] });
            } catch (e) { /* ignore */ }
        }
    }

    // Tap to focus
    video.addEventListener('click', async (e) => {
        if (!currentStream) return;
        const videoTrack = currentStream.getVideoTracks()[0];
        if (!videoTrack) return;
        const rect = video.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;

        // Show focus ring animation
        focusRing.style.left = `${e.clientX - rect.left}px`;
        focusRing.style.top = `${e.clientY - rect.top}px`;
        focusRing.style.display = 'block';
        setTimeout(() => focusRing.style.display = 'none', 1000);

        // Apply manual focus region (if supported)
        try {
            await videoTrack.applyConstraints({
                advanced: [{ pointsOfInterest: [{ x, y }] }]
            });
        } catch (e) { /* ignore if not supported */ }
    });

    // Capture photo with optional timer
    document.getElementById('capturePhotoBtn').addEventListener('click', () => {
        if (timerOn) {
            startCountdown(3);
        } else {
            capturePhoto();
        }
    });

    async function startCountdown(seconds) {
        countdownOverlay.style.display = 'flex';
        for (let i = seconds; i > 0; i--) {
            countdownOverlay.textContent = i;
            await new Promise(resolve => setTimeout(resolve, 1000));
        }
        countdownOverlay.style.display = 'none';
        capturePhoto();
    }

    function capturePhoto() {
        if (!currentStream) return;
        const videoTrack = currentStream.getVideoTracks()[0];
        const settings = videoTrack.getSettings ? videoTrack.getSettings() : null;
        const width = settings?.width || video.videoWidth;
        const height = settings?.height || video.videoHeight;

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, width, height);

        const imageData = canvas.toDataURL('image/jpeg', 0.95);
        reviewImage.src = imageData;
        photoReview.style.display = 'block';
        video.style.display = 'none';
        // hide camera controls while reviewing
        document.querySelector('.camera-controls-top').style.display = 'none';
        document.querySelector('.camera-controls-bottom').style.display = 'none';
    }

    // Retake button in review
    document.getElementById('retakePhotoBtnModern').addEventListener('click', () => {
        video.style.display = 'block';
        photoReview.style.display = 'none';
        document.querySelector('.camera-controls-top').style.display = 'flex';
        document.querySelector('.camera-controls-bottom').style.display = 'flex';
    });

    // Confirm photo button
    document.getElementById('confirmPhotoBtnModern').addEventListener('click', async () => {
        const imageData = reviewImage.src;
        if (!imageData || imageData === '') return;
        const snap = await bookingsRef.child(`${currentPhotoBookingKey}/verificationPhotos`).once('value');
        let photos = snap.val() || [];
        photos.push({ imageData, timestamp: new Date().toISOString(), uploadedBy: currentStaffEmail });
        await bookingsRef.child(`${currentPhotoBookingKey}/verificationPhotos`).set(photos);
        await loadPhotosForBooking(currentPhotoBookingKey);
        showToast('Photo captured and saved');
        closeModal('cameraModal');
    });

    // Gallery button inside camera (opens file upload)
    document.getElementById('galleryPreviewBtn').addEventListener('click', () => {
        document.getElementById('fileUpload').click();
    });

    // Collection signatures (unchanged)
    function initSignatureCanvas(canvasId) { /* ... same as before ... */ }
    window.clearCanvas = (id) => { /* ... */ };
    window.openCollectionModal = (bookingKey) => { /* ... */ };
    document.getElementById('submitCollectionReq').onclick = async () => { /* ... */ };

    // Real-time bookings
    function loadBookingsRealtime() {
        bookingsRef.on('value', (snap)=>{
            const bookings = [];
            snap.forEach(child=>{ const b=child.val(); b._key=child.key; bookings.push(b); });
            allBookings = bookings;
            refreshBookingsUI(bookings);
        });
    }

    function closeModal(id) {
        document.getElementById(id).style.display='none';
        if (id === 'cameraModal') {
            stopCamera();
            // Reset UI
            document.querySelector('.camera-controls-top').style.display = 'flex';
            document.querySelector('.camera-controls-bottom').style.display = 'flex';
            video.style.display = 'block';
            photoReview.style.display = 'none';
        }
    }
    function closeModalOnBg(e, id) { if(e.target===e.currentTarget) closeModal(id); }
    window.closeModal = closeModal;
    window.closeModalOnBg = closeModalOnBg;

    // Service Worker & Install Prompt
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered!', reg))
                .catch(err => console.error('Service Worker failed: ', err));
        });
    }
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        triggerInstall();
    });
    function triggerInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
        }
    }
</script>
</body>
</html>
